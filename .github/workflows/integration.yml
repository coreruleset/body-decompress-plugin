---
on: [push, pull_request]          # yamllint disable-line rule:truthy
name: Integration tests

jobs:
  integration-tests:
    uses: coreruleset/crs-plugin-test-action/.github/workflows/integration.yaml@81cb7f29881911c56f33a82d1e25dc26e0e13636 # v3.0.2  # yamllint disable-line rule:line-length
    with:
      # nginx (ModSecurity v3) is excluded: chained SecRuleScript directives
      # without an action list fail to parse under ModSecurity v3, see
      # https://github.com/owasp-modsecurity/ModSecurity/issues/3108
      backends: '["apache"]'
