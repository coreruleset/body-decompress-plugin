# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "body-decompress-plugin"
  description: "On-the-fly decompression of response bodies for CRS inspection"
  long_description: |
    Decompresses gzip-compressed HTTP response bodies so that CRS response
    rules can inspect the actual content. Detection is triggered when the
    response's Content-Encoding header contains gzip, compress, or deflate
    and the response body begins with the gzip magic number. Without this
    plugin, compressed responses bypass response body inspection rules.
  type: "official"
  category: "utility"
  status: "being-tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/body-decompress-plugin"
  keywords:
    - "decompression"
    - "response-body"
    - "gzip"

rule_id_range:
  start: 9503000
  end: 9503999

compatibility:
  crs_version: ">=4.0.0"
  engines:
    - "modsecurity2"
    - "modsecurity3"

configuration:
  file: "plugins/body-decompress-config.conf"
  variables:
    - name: "tx.body-decompress-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable response body decompression"

    - name: "tx.body-decompress-plugin_max_data_size_bytes"
      type: "integer"
      default: 102400
      description: "Maximum (compressed) response body size in bytes that will be decompressed; larger bodies are skipped"
      example: 102400
